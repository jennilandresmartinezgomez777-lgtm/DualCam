name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build DualCam.ipa
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive DualCam (Release, unsigned)
        run: |
          xcodebuild archive \
            -project DualCam.xcodeproj \
            -scheme DualCam \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/DualCam.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/DualCam.xcarchive/Products/Applications/DualCam.app build/Payload/
          cd build
          zip -r DualCam.ipa Payload
          ls -lh DualCam.ipa

      - name: Upload DualCam.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualCam-ipa
          path: build/DualCam.ipa
          retention-days: 30

      - name: Publish DualCam.ipa to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 build/DualCam.ipa --clobber
          else
            gh release create v1.0.0 build/DualCam.ipa \
              --title "DualCam v1.0.0" \
              --notes "Native iOS DualCam app (AVCaptureMultiCamSession). Unsigned .ipa ready for sideloading via AltStore, SideStore, or Sideloadly."
          fi
